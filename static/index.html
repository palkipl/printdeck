<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrintDeck</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --card2:#1c2230; --line:#262d3d;
    --text:#e8ecf4; --dim:#8a93a8; --accent:#3ea6ff; --good:#3ddc84;
    --warn:#ffb020; --bad:#ff5a5a; --omni:#b48cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;cursor:none}
  body{display:grid;grid-template-rows:auto 1fr;height:100vh;padding:1.2vh 1.2vw;gap:1.2vh}

  header{display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:700;font-size:2.4vh;letter-spacing:.04em}
  .brand span{color:var(--accent)}
  .clock{font-size:2.4vh;color:var(--dim);font-variant-numeric:tabular-nums}

  main{display:grid;grid-template-columns:1.35fr 1fr;gap:1.2vw;min-height:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:1.4vh;
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card-head{display:flex;align-items:center;justify-content:space-between;
    padding:1vh 1.2vw;border-bottom:1px solid var(--line)}
  .card-title{font-size:2.2vh;font-weight:650}
  .pill{font-size:1.6vh;font-weight:600;padding:.4vh .9vw;border-radius:99px;
    background:var(--card2);color:var(--dim);display:flex;align-items:center;gap:.5vw}
  .pill::before{content:"";width:1vh;height:1vh;border-radius:50%;background:currentColor}
  .pill.good{color:var(--good)} .pill.warn{color:var(--warn)}
  .pill.bad{color:var(--bad)} .pill.info{color:var(--accent)}

  .cam{position:relative;background:#000;aspect-ratio:16/9;width:100%;flex:0 0 auto;max-height:46vh}
  .cam iframe,.cam img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
  .cam .nofeed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:1.8vh;text-align:center;padding:2vh}

  .body{padding:1.2vh 1.2vw;display:flex;flex-direction:column;gap:1.2vh;min-height:0;flex:1}
  .job{display:grid;grid-template-columns:auto 1fr;gap:1.2vw;align-items:center}
  .thumb{width:15vh;height:15vh;border-radius:1vh;background:var(--card2);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:contain}
  .thumb .ph{color:var(--dim);font-size:1.4vh}
  .fname{font-size:2.2vh;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:1.6vh;color:var(--dim);margin-top:.4vh}
  .bar{height:1.6vh;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:1vh}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7cc4ff);
    border-radius:99px;transition:width .6s}
  .bar.omni>div{background:linear-gradient(90deg,var(--omni),#d8c2ff)}
  .pct{font-size:3.4vh;font-weight:750;font-variant-numeric:tabular-nums;margin-top:.6vh}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw}
  .stat{background:var(--card2);border-radius:1vh;padding:.9vh .8vw}
  .stat .l{font-size:1.4vh;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-size:2.3vh;font-weight:650;font-variant-numeric:tabular-nums;margin-top:.3vh;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v small{font-size:1.5vh;color:var(--dim);font-weight:500}

  .cfs{display:flex;gap:.8vw;flex-wrap:wrap}
  .slot{display:flex;align-items:center;gap:.5vw;background:var(--card2);border-radius:1vh;
    padding:.6vh .8vw;font-size:1.5vh}
  .slot i{width:2.2vh;height:2.2vh;border-radius:50%;border:2px solid #fff3;display:block}

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:.8vw}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand">Print<span>Deck</span></div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <!-- ======================= K2 ======================= -->
  <section class="card">
    <div class="card-head">
      <div class="card-title" id="k2-name">Creality K2 Combo</div>
      <div class="pill" id="k2-pill">Connecting…</div>
    </div>
    <div class="cam" id="k2-cam">
      <div class="nofeed" id="k2-nofeed">Waiting for camera…</div>
    </div>
    <div class="body">
      <div class="job">
        <div class="thumb" id="k2-thumb"><span class="ph">No preview</span></div>
        <div style="min-width:0">
          <div class="fname" id="k2-file">Nothing printing</div>
          <div class="sub" id="k2-sub">—</div>
          <div class="bar"><div id="k2-bar"></div></div>
          <div class="pct" id="k2-pct">0%</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="l">Nozzle</div><div class="v" id="t-noz">—</div></div>
        <div class="stat"><div class="l">Bed</div><div class="v" id="t-bed">—</div></div>
        <div class="stat"><div class="l">Chamber</div><div class="v" id="t-box">—</div></div>
        <div class="stat"><div class="l">Time left</div><div class="v" id="s-left">—</div></div>
        <div class="stat"><div class="l">Elapsed</div><div class="v" id="s-elap">—</div></div>
        <div class="stat"><div class="l">Done at</div><div class="v" id="s-eta">—</div></div>
      </div>
      <div class="cfs" id="k2-cfs"></div>
    </div>
  </section>

  <!-- ======================= OMNI ======================= -->
  <section class="card">
    <div class="card-head">
      <div class="card-title" id="omni-name">xTool O1 Omni</div>
      <div class="pill" id="omni-pill">Waiting for Mac bridge…</div>
    </div>
    <div class="cam" id="omni-cam">
      <div class="nofeed" id="omni-nofeed">Start the Omni Bridge app on your Mac</div>
      <img id="omni-img" class="hidden" alt="">
    </div>
    <div class="body">
      <div>
        <div class="fname" id="omni-title">—</div>
        <div class="sub" id="omni-sub">—</div>
        <div class="bar omni"><div id="omni-bar"></div></div>
      </div>
      <div class="fields" id="omni-fields"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const STATES = {0:["Idle","info"],1:["Printing","good"],2:["Complete","good"],
                3:["Failed","bad"],4:["Stopped","warn"],5:["Paused","warn"]};
let camLoaded = null, thumbVer = -1, omniStream = null;

function num(v){ const n = parseFloat(v); return isNaN(n) ? null : n; }
function temp(cur, tgt){
  cur = num(cur); tgt = num(tgt);
  if (cur === null) return "—";
  return `${cur.toFixed(0)}°` + (tgt ? ` <small>/ ${tgt.toFixed(0)}°</small>` : "");
}
function dur(s){
  s = num(s); if (s === null || s < 0) return "—";
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function color(c){
  if (!c) return "#555";
  c = String(c).replace("#",""); return "#" + c.slice(-6);
}
function findSlots(obj, out=[]){
  if (Array.isArray(obj)) obj.forEach(o => findSlots(o, out));
  else if (obj && typeof obj === "object"){
    if ("color" in obj && ("type" in obj || "name" in obj)) out.push(obj);
    else Object.values(obj).forEach(o => findSlots(o, out));
  }
  return out;
}

function renderK2(k2, cfg){
  const r = k2.raw || {};
  // header
  if (r.model || r.hostname) $("k2-name").textContent = r.model ? `Creality ${r.model}` : r.hostname;
  const pill = $("k2-pill");
  if (!k2.connected){ pill.textContent = "Offline"; pill.className = "pill bad"; }
  else {
    const st = STATES[r.state] || ["Online","info"];
    pill.textContent = st[0]; pill.className = "pill " + st[1];
  }

  // camera (go2rtc on this Pi re-streams the K2's WebRTC feed)
  if (k2.connected && camLoaded !== cfg.camera_mode){
    const src = cfg.camera_mode === "mjpeg" ? "k2_mjpeg" : "k2";
    const mode = cfg.camera_mode === "mjpeg" ? "mjpeg" : "webrtc,mse";
    $("k2-cam").innerHTML =
      `<iframe allow="autoplay" src="http://${location.hostname}:${cfg.go2rtc_port}/stream.html?src=${src}&mode=${mode}"></iframe>`;
    camLoaded = cfg.camera_mode;
  }

  // job
  const fname = (r.printFileName || "").split("/").pop().replace(/\.gcode$/i,"");
  const active = [1,5].includes(Number(r.state));
  $("k2-file").textContent = fname || "Nothing printing";
  const layer = num(r.layer), total = num(r.TotalLayer);
  $("k2-sub").textContent = total ? `Layer ${layer ?? 0} / ${total}` : (active ? "Printing" : "Ready");
  const pct = Math.max(0, Math.min(100, num(r.printProgress) ?? 0));
  $("k2-bar").style.width = pct + "%";
  $("k2-pct").textContent = pct.toFixed(0) + "%";

  if (k2.thumb_ver !== thumbVer){
    thumbVer = k2.thumb_ver;
    $("k2-thumb").innerHTML = thumbVer > 0
      ? `<img src="/api/thumb.png?v=${thumbVer}" alt="">` : `<span class="ph">No preview</span>`;
  }

  // stats
  $("t-noz").innerHTML = temp(r.nozzleTemp, r.targetNozzleTemp);
  $("t-bed").innerHTML = temp(r.bedTemp0, r.targetBedTemp0);
  $("t-box").innerHTML = temp(r.boxTemp, r.targetBoxTemp);
  const left = num(r.printLeftTime);
  $("s-left").textContent = active ? dur(left) : "—";
  $("s-elap").textContent = active ? dur(r.printJobTime) : "—";
  $("s-eta").textContent = active && left
    ? new Date(Date.now() + left*1000).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "—";

  // CFS filament slots (K2 Combo)
  const slots = findSlots(r.boxsInfo || r.materials || {}).slice(0, 8);
  $("k2-cfs").innerHTML = slots.map((s, i) => {
    const label = s.type || s.name || "—";
    const p = num(s.percent);
    return `<div class="slot"><i style="background:${color(s.color)}"></i>${label}${p !== null ? ` · ${p}%` : ""}</div>`;
  }).join("");
}

function renderOmni(o){
  const pill = $("omni-pill"), s = o.status || {};
  if (!o.bridge){ pill.textContent = "Waiting for Mac bridge…"; pill.className = "pill"; }
  else if (!o.connected){ pill.textContent = "Bridge offline"; pill.className = "pill bad"; }
  else { pill.textContent = s.state || "Online"; pill.className = "pill " + (s.state_color || "good"); }

  if (s.device_name) $("omni-name").textContent = s.device_name;
  $("omni-title").textContent = s.title || "—";
  $("omni-sub").textContent = s.subtitle || (o.connected ? "Connected via Mac" : "—");
  const p = num(s.progress);
  $("omni-bar").parentElement.classList.toggle("hidden", p === null);
  $("omni-bar").style.width = (p ?? 0) + "%";

  const want = o.connected && s.stream ? `${o.bridge}/stream.mjpg` : null;
  if (want !== omniStream){
    omniStream = want;
    const img = $("omni-img");
    if (want){ img.src = want; img.classList.remove("hidden"); $("omni-nofeed").classList.add("hidden"); }
    else { img.removeAttribute("src"); img.classList.add("hidden"); $("omni-nofeed").classList.remove("hidden"); }
  }
  $("omni-fields").innerHTML = (s.fields || []).map(([l, v]) =>
    `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
}

async function tick(){
  try{
    const r = await fetch("/api/state", {cache:"no-store"});
    const st = await r.json();
    renderK2(st.k2, st.config);
    renderOmni(st.omni);
  }catch(e){ $("k2-pill").textContent = "Dashboard server down"; $("k2-pill").className = "pill bad"; }
}
setInterval(tick, 1000); tick();
setInterval(() => $("clock").textContent =
  new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}), 1000);
// If the Omni MJPEG stream drops, retry it
$("omni-img").onerror = () => {
  $("omni-img").classList.add("hidden");
  $("omni-nofeed").textContent = "Omni feed reconnecting…";
  $("omni-nofeed").classList.remove("hidden");
  setTimeout(() => { omniStream = null; }, 5000);
};
</script>
</body>
</html>
