<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrintDeck · Loading</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;cursor:none!important}
  html,body{height:100%;background:#07090d;color:#eef1f7;overflow:hidden;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh}
  .lock{display:flex;align-items:center;gap:3vh;animation:in .8s ease-out both}
  .lock svg{width:14vh;height:14vh}
  .word{font-size:9vh;font-weight:800;letter-spacing:-.02em}
  .word b{color:#36d6a0}
  .track{width:34vh;height:.8vh;border-radius:99px;background:#171c27;overflow:hidden;position:relative;
    animation:in .8s .2s ease-out both}
  .seg{position:absolute;top:0;left:0;height:100%;width:35%;border-radius:99px;
    background:linear-gradient(90deg,#1aa37a,#7ff0c8);animation:slide 1.4s ease-in-out infinite alternate}
  .msg{font-size:2.6vh;color:#7d879c;animation:in .8s .35s ease-out both}
  @keyframes slide{to{left:65%}}
  @keyframes in{from{opacity:0;transform:translateY(1.5vh)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="lock">
    <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#07090d"/>
      <rect x="96" y="120" width="320" height="272" rx="40" fill="none" stroke="#36d6a0" stroke-width="32"/>
      <rect x="176" y="96" width="160" height="56" rx="20" fill="#36d6a0"/>
      <path d="M176 320h160M208 272h96" stroke="#a98bff" stroke-width="32" stroke-linecap="round"/>
      <circle cx="256" cy="208" r="26" fill="#eef1f7"/></svg>
    <div class="word">Print<b>Deck</b></div>
  </div>
  <div class="track"><div class="seg"></div></div>
  <div class="msg" id="msg">Loading…</div>
<script>
  // Opened from disk at boot; jumps to the dashboard as soon as the server answers.
  const DASH = "http://localhost:5000/?kiosk=1";
  const steps = ["Loading…", "Starting server…", "Connecting to printers…", "Almost there…"];
  let n = 0;
  setInterval(() => { document.getElementById("msg").textContent = steps[Math.min(++n, steps.length - 1)]; }, 4000);
  async function check(){
    try { await fetch("http://localhost:5000/api/state", {mode: "no-cors", cache: "no-store"}); location.replace(DASH); }
    catch (e) { setTimeout(check, 1000); }
  }
  setTimeout(check, 1200);   // let the animation show for a moment
</script>
</body>
</html>
