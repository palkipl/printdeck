<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PrintDeck · Loading</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;cursor:none!important}
  html,body{height:100%;background:#07090d;overflow:hidden}
  /* Same picture as the desktop wallpaper, placed the same way ("fit"), so the switch is invisible */
  .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;
    background:url("../branding/wallpaper.png") center/contain no-repeat}
  .track{position:absolute;left:50%;top:71%;transform:translateX(-50%);width:19%;height:.75%;
    min-height:5px;border-radius:99px;background:#171c27;overflow:hidden}
  .seg{position:absolute;top:0;left:0;height:100%;width:35%;border-radius:99px;
    background:linear-gradient(90deg,#1aa37a,#7ff0c8);animation:slide 1.3s ease-in-out infinite alternate}
  @keyframes slide{to{left:65%}}
  body.out .stage{opacity:0;transition:opacity .35s}
</style>
</head>
<body>
  <div class="stage"><div class="track"><div class="seg"></div></div></div>
<script>
  // Opened from disk at boot; jumps to the dashboard as soon as the server answers.
  const DASH = "http://localhost:5000/?kiosk=1";
  async function check(){
    try {
      await fetch("http://localhost:5000/api/state", {mode: "no-cors", cache: "no-store"});
      document.body.classList.add("out");
      setTimeout(() => location.replace(DASH), 350);
    } catch (e) { setTimeout(check, 700); }
  }
  check();
</script>
</body>
</html>
